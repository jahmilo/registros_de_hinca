<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#16364b"><link rel="manifest" href="manifest.json"><title>Control de hinca</title><style> *{box-sizing:border-box}body{font:16px system-ui;background:#eef2f5;color:#16364b;margin:auto;max-width:650px;padding:16px}section{background:white;border-radius:14px;padding:16px;margin:12px 0}button,input,select,textarea{font:inherit;padding:12px;border:1px solid #bbc9d0;border-radius:8px;width:100%;margin:5px 0}button{background:#16364b;color:white;cursor:pointer}button:disabled{opacity:.4}label{display:block;margin-top:8px}h1,h2,p{margin:8px 0}h2{font-size:19px}.clock{font-size:40px;font-weight:bold;text-align:center;font-variant-numeric:tabular-nums}.small{font-size:14px;color:#526571}.green{background:#20734e}.amber{background:#956013}.red{background:#a32f35}table{width:100%;font-size:13px;border-collapse:collapse}td,th{padding:7px 3px;border-bottom:1px solid #ddd;text-align:left}  .overlay{position:fixed;inset:0;background:#0008;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px}.overlay[hidden]{display:none}.modal{background:white;border-radius:14px;padding:20px;width:100%;max-width:400px;box-shadow:0 8px 30px #0004}.modal button{min-height:48px} </style><h1>Control de hinca</h1><p class="small">Versión 0.7 · Vibrohincador</p><section><select id="pick"></select><button id="new">Nuevo protocolo</button><label>Identificación de viga<input id="name"></label><label>Longitud (m)<input id="len" inputmode="decimal"></label><p id="status"></p></section><section><p>Tiempo efectivo acumulado</p><div class="clock" id="total">00:00</div><p id="detail"></p><button class="green" id="start" style="min-height:76px;font-size:22px;font-weight:700;touch-action:manipulation">▶ Iniciar hinca</button><label>Penetración acumulada (m, opcional)<input id="depth" inputmode="decimal" placeholder="Ej. 5,56"></label><button id="stage">Finalizar etapa</button><button id="save">Guardar y continuar otro día</button><button class="red" id="finish">Finalizar hinca</button></section><section><h2>Etapas registradas</h2><div id="stages"></div><h2>Resumen diario</h2><div id="days"></div><details><summary>Editar ciclos de funcionamiento</summary><div id="cycles"></div></details></section><section><h2>Observaciones</h2><button id="generate">Generar observaciones</button><textarea id="notes" rows="8"></textarea><button id="backup">Descargar respaldo JSON</button><label>Restaurar respaldo<input type="file" id="restore" accept=".json"></label></section><div id="finishDialog" class="overlay" hidden><div class="modal" role="alertdialog" aria-modal="true" aria-labelledby="finishTitle"><h2 id="finishTitle">¿Seguro quiere finalizar la hinca?</h2><p>Se guardará el tiempo registrado. Podrás completar las penetraciones pendientes después.</p><button class="red" id="confirmFinish">Sí, finalizar hinca</button><button id="cancelFinish">Cancelar</button></div></div><script>
const $=id=>document.getElementById(id), key='hinca-v1';let db;try{db=JSON.parse(localStorage.getItem(key))||[]}catch{db=[]}let current=0;const fresh=()=>({name:'Nueva viga',len:'',cycles:[],stages:[],active:null,closed:false,notes:''});if(!db.length)db.push(fresh());let r=()=>db[current];function persist(){try{localStorage.setItem(key,JSON.stringify(db))}catch(e){alert('No se pudo guardar. Descarga un respaldo.')}}const fmt=s=>{s=Math.max(0,Math.floor(s));return [Math.floor(s/60),s%60].map(x=>String(x).padStart(2,'0')).join(':')};const day=t=>{let d=new Date(t);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};const date=t=>new Date(t).toLocaleString('es-CL');const dur=c=>(c.end-c.start)/1000;function all(){return [...r().cycles,...(r().active!==null?[{start:r().active,end:Date.now(),stage:r().stages.length}]:[])]}function groups(){let g={};for(let c of all()){let t=c.start;while(t<c.end){let n=new Date(t);n.setHours(24,0,0,0);let e=Math.min(+n,c.end),k=day(t);let a=g[k]||(g[k]={s:0,start:t,end:e});a.s+=(e-t)/1000;a.start=Math.min(a.start,t);a.end=Math.max(a.end,e);t=e}}return Object.entries(g).sort()}
const depthDraft=new WeakMap(); $('depth').oninput=e=>depthDraft.set(r(),e.target.value); function pending(){return r().active!==null||r().cycles.some(c=>c.stage>=r().stages.length)} function validDepth(d,i){return Number.isFinite(d)&&d>=0&&r().stages.every((s,j)=>s.depth==null||j===i||(j<i?s.depth<=d:s.depth>=d))} function closeStage(){let d=$('depth').value.trim().replace(',','.');if(d&&!validDepth(+d,r().stages.length)){alert('Ingresa una penetración acumulada válida o deja el campo vacío');return false}if(!pending()){alert('No hay tiempo registrado en esta etapa');return false}pause();r().stages.push({depth:d?+d:null});depthDraft.delete(r());persist();return true} function tick(){let a=all();$('total').textContent=fmt(a.reduce((s,c)=>s+dur(c),0));$('detail').textContent='Etapa '+(r().stages.length+1)+' · '+fmt(a.filter(c=>c.stage===r().stages.length).reduce((s,c)=>s+dur(c),0))+' | Hoy: '+fmt(groups().find(([k])=>k===day(Date.now()))?.[1].s||0)}function render(){let v=r();$('pick').replaceChildren(...db.map((x,i)=>new Option(x.name+(x.closed?' (finalizado)':''),i)));$('pick').value=current;$('name').value=v.name;$('len').value=v.len;$('notes').value=v.notes;$('depth').value=depthDraft.get(v)||'';$('status').textContent=v.closed?'Finalizado':v.active!==null?'En funcionamiento':'En pausa';$('start').disabled=v.closed;$('start').className=v.active!==null?'amber':'green';$('start').textContent=v.active!==null?'⏸ Pausar hinca':v.cycles.length?'▶ Reanudar hinca':'▶ Iniciar hinca';$('stage').disabled=v.closed||!pending();$('depth').disabled=v.closed;$('finish').textContent=v.closed?'Reabrir protocolo':'Finalizar hinca';$('stages').replaceChildren();v.stages.forEach((s,i)=>{let cs=v.cycles.filter(c=>c.stage===i), p=document.createElement('p');p.textContent=`Etapa ${i+1}: ${s.depth==null?"Sin registrar":s.depth+" m"} · ${fmt(cs.reduce((a,c)=>a+dur(c),0))} · Acum. ${fmt(v.cycles.filter(c=>c.stage<=i).reduce((a,c)=>a+dur(c),0))} · ${cs.length?date(cs[0].start)+' — '+date(cs.at(-1).end):''}`;let b=document.createElement('button');b.textContent='Editar penetración';b.onclick=()=>{let x=prompt('Penetración acumulada (m). Deja vacío si está pendiente.',s.depth??'');if(x===null)return;let d=x.trim().replace(',','.');if(d&&!validDepth(+d,i)){alert('Penetración inválida o incompatible con las otras etapas');return}s.depth=d?+d:null;persist();render()};$('stages').append(p,b)});$('days').replaceChildren(...groups().map(([k,a])=>{let p=document.createElement('p');p.textContent=k+' · '+fmt(a.s)+' · '+date(a.start)+' — '+date(a.end);return p}));$('cycles').replaceChildren(...v.cycles.map((c,i)=>{let b=document.createElement('button');b.textContent=`Etapa ${c.stage+1}: ${date(c.start)} — ${date(c.end)} (${fmt(dur(c))})`;b.onclick=()=>{let iso=t=>{let d=new Date(t);return new Date(t-d.getTimezoneOffset()*60000).toISOString().slice(0,19)};let a=prompt('Inicio (AAAA-MM-DDTHH:MM:SS)',iso(c.start));if(a===null)return;let z=prompt('Pausa / término',iso(c.end));if(z===null)return;let x=+new Date(a),y=+new Date(z);if(!Number.isFinite(x)||!Number.isFinite(y)||y<x||v.cycles.some((q,j)=>j!==i&&x<q.end&&y>q.start)){alert('Horario inválido o superpuesto');return}c.start=x;c.end=y;persist();render()};return b}));tick()}
function pause(){if(r().active!==null){r().cycles.push({start:r().active,end:Date.now(),stage:r().stages.length});r().active=null;persist()}}$('start').onclick=()=>{if(r().closed)return;if(r().active!==null){pause();render();return}if(db.some(x=>x.active!==null)){alert('Ya existe una hinca en funcionamiento');return}r().active=Date.now();persist();render()};$('stage').onclick=()=>{if(!r().closed&&closeStage())render()};$('save').onclick=()=>{pause();persist();render()};let finishTarget=null;function dismissFinish(){ $('finishDialog').hidden=true;finishTarget=null;$('finish').focus() } $('finish').onclick=()=>{if(r().closed){r().closed=false;persist();render();return}finishTarget=r();$('finishDialog').hidden=false;$('cancelFinish').focus()};$('cancelFinish').onclick=dismissFinish;$('confirmFinish').onclick=()=>{if(finishTarget!==r()||r().closed){dismissFinish();return}if(pending()&&!closeStage()){dismissFinish();return}r().closed=true;persist();dismissFinish();render()};document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('finishDialog').hidden)dismissFinish()});$('new').onclick=()=>{db.push(fresh());current=db.length-1;persist();render()};$('pick').onchange=e=>{current=+e.target.value;render()};$('name').addEventListener('focus',e=>{e.target.select();});$('name').addEventListener('click',e=>{if(e.target.value==='Nueva viga')e.target.select();});for(let [id,k] of [['name','name'],['len','len'],['notes','notes']])$(id).oninput=e=>{r()[k]=e.target.value;persist();if(id==='name')$('pick').options[current].text=e.target.value};$('generate').onclick=()=>{if(r().notes&&!confirm('¿Reemplazar observaciones actuales?'))return;r().notes='Hinca del perfil HEB 300 mediante vibrohincador.\n'+groups().map(([k,a])=>`${k}: inicio ${date(a.start)}, pausa o término ${date(a.end)}, tiempo efectivo ${fmt(a.s)}.`).join('\n')+'\nTiempo efectivo acumulado: '+fmt(all().reduce((s,c)=>s+dur(c),0))+'. Penetración acumulada registrada: '+(r().stages.at(-1)?.depth==null?'pendiente':r().stages.at(-1).depth+' m')+'.';persist();render()};$('backup').onclick=()=>{let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='respaldo-hinca.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};$('restore').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d)||!d.length||!d.every(x=>typeof x.name==='string'&&Array.isArray(x.cycles)&&Array.isArray(x.stages)))throw Error();if(confirm('¿Reemplazar registros locales con el respaldo?')){db=d;current=0;persist();render()}}catch{alert('Respaldo inválido')}};render();setInterval(tick,250);if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></html>
